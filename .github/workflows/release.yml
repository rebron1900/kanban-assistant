name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 读取 manifest.json 中的版本号用于 Release 标题
          VERSION=$(node -p "require('./manifest.json').version")
          
          # 打包发布文件（Obsidian 社区插件只需这三个文件）
          mkdir -p release
          cp main.js manifest.json styles.css release/ 2>/dev/null || true
          cd release
          
          # 创建 GitHub Release
          gh release create "$TAG" \
            --title "看板助手 v$VERSION" \
            --notes "自动构建发布" \
            main.js manifest.json styles.css
