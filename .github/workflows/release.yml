name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 读取 manifest.json 中的版本号用于 Release 标题
          VERSION=$(node -p "require('./manifest.json').version")

          # 打包发布文件（只包含确实存在的文件）
          mkdir -p release
          ASSETS=""
          for f in main.js manifest.json styles.css; do
            if [ -f "$f" ]; then
              cp "$f" release/
              ASSETS="$ASSETS $f"
            fi
          done
          cd release

          # 创建 GitHub Release
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "看板助手 v$VERSION" \
            --notes "自动构建发布" \
            $ASSETS
